<!doctype html>
<html>
<head><meta charset="utf-8"><title>材质隔离测试</title></head>
<body style="margin:0">
<canvas id="c" width="512" height="512"></canvas>
<script type="module">
import * as THREE from 'three'
import { PaintedMaterial } from '/src/core/PaintedMaterial.ts'
import { makeSurfaceTexture, makeBaseTexture, makeFadeMaskTexture, makeRestoreLayer } from '/src/core/TextureFactory.ts'

const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false })
renderer.setPixelRatio(1)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#1b1e24')
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100)
camera.position.z = 4
scene.add(new THREE.AmbientLight(0xffffff, 1.5))

const restore = makeRestoreLayer()
const mat = new PaintedMaterial({
  surface: makeSurfaceTexture('t1'),
  base: makeBaseTexture('t1'),
  fadeMask: makeFadeMaskTexture('t1'),
  restore: restore.texture
})
const mesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), mat)
scene.add(mesh)

window.__test = { renderer, scene, camera, mat, restoreCanvas: restore.canvas, restoreTexture: restore.texture }

function frame() {
  renderer.render(scene, camera)
  requestAnimationFrame(frame)
}
frame()
</script>
</body>
</html>
