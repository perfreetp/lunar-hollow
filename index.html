<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050d14" />
    <meta
      name="description"
      content="白礁水道夜航灯标可视化：海图水深着色、灯塔光晕叠加、航标灯质闪烁与航段导出。"
    />
    <title>夜航灯标 · 白礁水道</title>
    <!-- Inline favicon: avoids a 404 for /favicon.ico without shipping a file. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2307141b'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237fe3e0' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23fff4d6'/%3E%3C/svg%3E"
    />
  </head>
  <body class="theme-night">
    <div id="app">
      <div id="chart-shell">
        <div id="map" aria-label="白礁水道海图"></div>
        <canvas id="ink" aria-hidden="true"></canvas>
        <div id="glow-wrap"><canvas id="glow" aria-hidden="true"></canvas></div>
        <div id="labels"></div>
        <div id="ship-layer" aria-hidden="true">
          <button type="button" id="ship-puck" aria-label="拖动船位" title="拖动船位 · 方向键微调">
            <svg viewBox="-16 -16 32 32" width="32" height="32" aria-hidden="true">
              <circle cx="0" cy="0" r="13" class="puck-ring" />
              <path d="M8 0 L2 4 -4 3 -4 -3 2 -4 Z" class="puck-hull" />
              <line x1="-13" y1="0" x2="-9" y2="0" class="puck-tick" />
              <line x1="9" y1="0" x2="13" y2="0" class="puck-tick" />
              <line x1="0" y1="-13" x2="0" y2="-9" class="puck-tick" />
              <line x1="0" y1="9" x2="0" y2="13" class="puck-tick" />
            </svg>
          </button>
        </div>
        <div id="chart-frame">
          <span class="frame-mark">◆</span>
          <span>CHART 18402</span>
          <span class="frame-sep">/</span>
          <span>白礁水道 BAIJIAO PASSAGE</span>
          <span class="frame-sep">/</span>
          <span>1:25 000</span>
        </div>
        <div id="boot-status" role="status">正在生成海图与灯标模型…</div>
      </div>

      <np-topbar></np-topbar>
      <np-sidepanel></np-sidepanel>
      <np-inspector></np-inspector>
      <np-statusbar></np-statusbar>
      <np-export-dialog></np-export-dialog>
      <np-toast></np-toast>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
